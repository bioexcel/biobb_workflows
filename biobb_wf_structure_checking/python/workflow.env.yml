name: biobb_wf_structure_checking
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - biobb_structure_utils==5.3.0
  - biobb_model==5.3.0
  - biobb_chemistry==5.3.0
  - biobb_amber==5.3.1
  # biobb_structure_utils leaves biobb_structure_checking unpinned (>=3.13.5);
  # 3.16.3 (2026-09-02) added a sequence-mismatch check that crashes with
  # KeyError when no canonical sequence is given (step0 runs structure_check
  # on the raw PDB) — 3.16.2 is the last working release.
  - biobb_structure_checking=3.16.2
