name: biobb_wf_pmx_tutorial
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - biobb_pmx==5.3.0
  - biobb_gromacs==5.3.2
  - biobb_analysis==5.3.0
  - scipy==1.13
  # pmx 5.2.2's BAR estimator does float(scipy.optimize.fmin(...)); fmin has
  # always returned a (1,) array and numpy >= 2 removed the ndim>0 -> scalar
  # conversion, which crashes `pmx analyse`. Keep numpy < 2.
  - numpy: '<2'
