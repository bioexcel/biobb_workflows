name: biobb_wf_virtual-screening
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - biobb_structure_utils==5.3.0
  - biobb_vs==5.3.0
  - biobb_chemistry==5.3.0
  # Open Babel >= 3.2 copies the input PDB's COMPND/AUTHOR header lines into the
  # ligand .pdbqt, and AutoDock Vina 1.2.7 rejects them ("PDBQT parsing error").
  # biobb_chemistry 5.3.0 (build 1, Oct 2026) relaxed its pin to openbabel >=3.1.1.
  # Conda mode only: in container mode Open Babel comes from the biocontainers image.
  - openbabel==3.1.1
