name: biobb_wf_amber
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - biobb_structure_utils==5.3.0
  # extract_molecule shells out to check_structure. biobb_structure_utils only
  # requires >=3.15.6, so CI resolves the latest. 3.16.x added a live RCSB
  # monomers-API fetch in print_stats (fetch_residue_name_by_id) that raises
  # an IOError and aborts the step when there is no network (CI). Pin the last
  # network-free release.
  - biobb_structure_checking==3.15.6
  - biobb_chemistry==5.3.0
  - biobb_amber==5.3.3
  - biobb_analysis==5.3.0
  # ambertools depends on mkl without a version pin, and conda-forge's
  # mkl 2026.x no longer ships libmkl_core.so.2 (cpptraj fails to load).
  # 2025.x still ships it — the same major line the docker image env
  # resolves (mkl 2025.0.0), where cpptraj works.
  - mkl <2026
