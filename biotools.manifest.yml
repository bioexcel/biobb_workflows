# bio.tools entries of the BioBB workflows: one per WORKFLOW (all flavours together),
# unlike WorkflowHub (one entry per flavour). Used by .github/biotools/biotools_update.py
# (workflow .github/workflows/biotools-update.yml), which only changes, per entry:
#   version   adds the release label
#   link      one "Software catalogue" link per WorkflowHub entry of the workflow (from
#             workflowhub.manifest.yml) + the workflow folder on GitHub ("Repository")
#   download  the workflow folder ("Source code") + the GHCR Docker image ("Container file")
# Everything else (description, EDAM terms, publications, credits) is edited by hand on
# bio.tools. Dead links found are reported, never removed automatically.
#
# Fields: wf (folder), biotoolsID, optional workflowhub (path prefixes of the WorkflowHub
# entries to link; default: the whole wf folder) and workflowhub_exclude (prefixes to leave
# out), skip: true (never touched), fix_urls (outdated URLs found by --check-links: old: new
# replaces it in homepage/link/download/documentation, old: null removes it).
#
# Editing rights (2026-11-24): the job's account (the bio.tools user of BIOTOOLS_TOKEN) can
# edit all 20 entries (2 its own; the other 18 belong to another account, which added it as an editor:
# bio.tools entry -> Update -> Permissions). The DNA entry's check-only address is blocked
# by the SDU firewall; the script saves it without that check (see biotools_update.py).
entries:
  - wf: biobb_wf_amber_abc_setup
    biotoolsID: bioexcel_building_blocks_tutorials_abc_md_setup
    fix_urls:
      https://biobb-wf-amber-md-setup.readthedocs.io/en/latest/abcsetup_tutorial.html: https://biobb-wf-amber-md-setup.readthedocs.io/en/latest/abc_setup_tutorial.html
  - wf: biobb_wf_amber_md_setup
    biotoolsID: bioexcel_building_blocks_tutorials_protein_md_setup_amber_version
    fix_urls:
      https://biobb-wf-amber-md-setup.readthedocs.io/en/latest/mdsetup_tutorial.html: https://biobb-wf-amber-md-setup.readthedocs.io/en/latest/md_setup_tutorial.html
    workflowhub_exclude: [biobb_wf_amber_md_setup/jupyter/biobb_wf_amber/notebooks/md_setup_ph]
  - wf: biobb_wf_amber_md_setup
    biotoolsID: bioexcel_building_blocks_tutorials_amber_constant_ph_md_setup
    fix_urls:
      https://biobb-wf-amber-md-setup.readthedocs.io/en/latest/mdsetup_ph_tutorial.html: https://biobb-wf-amber-md-setup.readthedocs.io/en/latest/md_setup_ph_tutorial.html
    workflowhub: [biobb_wf_amber_md_setup/jupyter/biobb_wf_amber/notebooks/md_setup_ph]
  - wf: biobb_wf_amber_md_setup_lig
    biotoolsID: bioexcel_building_blocks_tutorials_protein-ligand_complex_md_setup_amber_version
    fix_urls:
      https://biobb-wf-amber-md-setup.readthedocs.io/en/latest/mdsetup_lig_tutorial.html: https://biobb-wf-amber-md-setup.readthedocs.io/en/latest/md_setup_lig_tutorial.html
  - wf: biobb_wf_autoencoder
    biotoolsID: bioexcel_building_blocks_tutorials_autoencoders_for_anomaly_detection
  - wf: biobb_wf_cmip
    biotoolsID: bioexcel_building_blocks_tutorials_molecular_interaction_potentials
  - wf: biobb_wf_dna_helparms
    biotoolsID: bioexcel_building_blocks_tutorials_structural_dna_helical_parameters_from_md_trajectory
  - wf: biobb_wf_flexdyn
    biotoolsID: 3d-bioinfo_bioexcel_protein_conformational_ensembles_generation
    fix_urls:  # the BioExcel Binder at EBI is gone (and this pointed to the md_setup notebook)
      "https://bioexcel-binder.tsi.ebi.ac.uk/v2/gh/bioexcel/biobb_wf_md_setup/master?filepath=biobb_wf_md_setup%2Fnotebooks%2Fbiobb_MDsetup_tutorial.ipynb": null
  - wf: biobb_wf_flexserv
    biotoolsID: bioexcel_building_blocks_tutorials_macromolecular_coarse-grained_flexibility
  - wf: biobb_wf_godmd
    biotoolsID: bioexcel_building_blocks_tutorials_protein_conformational_transitions
  - wf: biobb_wf_haddock
    biotoolsID: bioexcel_building_blocks_tutorials_protein-protein_docking
  - wf: biobb_wf_ligand_parameterization
    biotoolsID: bioexcel_building_blocks_tutorials_automatic_ligand_parameterization
    fix_urls:
      "http://mmb.irbbarcelona.org/biobb/workflows/#automatic-ligand-parameterization": "https://mmb.irbbarcelona.org/biobb/workflows/#automatic-ligand-parameterization"
  - wf: biobb_wf_md_setup
    biotoolsID: bioexcel_building_blocks_tutorials_protein_md_setup
    fix_urls:
      "http://mmb.irbbarcelona.org/biobb/workflows/#gromacs-protein-md-setup": "https://mmb.irbbarcelona.org/biobb/workflows/#gromacs-protein-md-setup"
  - wf: biobb_wf_md_setup_mutations
    biotoolsID: bioexcel_building_blocks_tutorials_protein_md_setup_with_mutations
  - wf: biobb_wf_mem
    biotoolsID: bioexcel_building_blocks_tutorials_protein-membrane_md_analysis
  - wf: biobb_wf_pmx_tutorial
    biotoolsID: bioexcel_building_blocks_tutorials_mutation_free_energy_calculations
    fix_urls:
      "http://mmb.irbbarcelona.org/biobb/workflows/#mutation-free-energy-calculations": "https://mmb.irbbarcelona.org/biobb/workflows/#mutation-free-energy-calculations"
  - wf: biobb_wf_protein-complex_md_setup
    biotoolsID: bioexcel_building_blocks_tutorials_protein-ligand_complex_md_setup
    fix_urls:
      "http://mmb.irbbarcelona.org/biobb/workflows/#gromacs-protein-ligand-complex-md-setup": "https://mmb.irbbarcelona.org/biobb/workflows/#gromacs-protein-ligand-complex-md-setup"
  - wf: biobb_wf_protein_md_analysis
    biotoolsID: bioexcel_building_blocks_tutorials_protein_md_analysis
  - wf: biobb_wf_structure_checking
    biotoolsID: bioexcel_building_blocks_tutorials_molecular_structure_checking
  - wf: biobb_wf_virtual-screening_fpocket
    biotoolsID: bioexcel_building_blocks_tutorials_protein-ligand_docking
