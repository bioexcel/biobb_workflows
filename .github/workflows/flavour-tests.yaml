name: Flavour e2e Tests (manual)

# Phase 1: run the local e2e test scripts (tests/<flavour>/run_test.sh) from CI,
# on demand, workflow by workflow. Trigger it from the Actions tab:
#   1. choose the flavour (docker / cwl / airflow / jupyter / nextflow / python)
#      — python does not have a run_test.sh: it reuses the CI python pipeline
#        (python-reusable.yaml, incl. the per-wf runtime reductions)
#   2. leave wf_names empty to test EVERY workflow that has that test,
#      or type one, e.g.  biobb_wf_ligand_parameterization
#
# Once a flavour proves reliable here, a push trigger can be added in phase 2.

on:
  # Weekly full round (docs/ci.md §1.1c): every eligible workflow, so breakage
  # from outside (conda packages, runner images) is found within a week even
  # when nobody pushes. One flavour per day; times are UTC, off the hour.
  # Thursday afternoon: Docker images, built from today's main and tested, NEVER published.
  schedule:
    - cron: '17 12 * * 4'
  workflow_dispatch:
    inputs:
      flavour:
        description: 'Flavour to test'
        required: true
        default: 'docker'
        type: choice
        options:
          - docker
          - cwl
          - airflow
          - jupyter
          - nextflow
          - python
      wf_names:
        description: 'Workflow FOLDERS to test, e.g. biobb_wf_ligand_parameterization,biobb_wf_cmip (empty = all that have this test)'
        required: false
        default: ''
        type: string

jobs:
  detect:
    # shows the flavour right in the job list (dispatch runs; 'auto' otherwise)
    name: Detect workflows to test (${{ (github.event_name == 'schedule' && 'docker') || github.event.inputs.flavour || 'auto' }})
    uses: ./.github/workflows/detect.yaml
    with:
      wf_names: ${{ github.event.inputs.wf_names || '' }}
      all_on_paths: '^\.github/workflows/(detect|flavour-tests|flavour-test-reusable)\.yaml$'
      # flavour -> require_path mapping happens in detect (python: tests/python,
      # other: tests/<flavour>/run_test.sh)
      # a scheduled run has no inputs: it is the weekly docker round
      flavour: ${{ (github.event_name == 'schedule' && 'docker') || github.event.inputs.flavour || '' }}

  test:
    name: ${{ matrix.wf }} (${{ (github.event_name == 'schedule' && 'docker') || github.event.inputs.flavour || '' }})
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.matrix != '[]'
    uses: ./.github/workflows/flavour-test-reusable.yaml
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    with:
      wf_name: ${{ matrix.wf }}
      flavour: ${{ (github.event_name == 'schedule' && 'docker') || github.event.inputs.flavour || '' }}
