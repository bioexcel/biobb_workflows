name: Python workflow Tests

on:
  push:
    # test-what-you-changed: only the python flavour's own paths trigger it
    # (the always-on push trigger and the weekly full regression were removed
    # 2026-09-22 — see ci.md)
    paths:
      - 'biobb_wf_*/python/**'
      - 'biobb_wf_*/tests/python/**'
      # a change to the pipeline itself tests everything
      - .github/workflows/detect.yaml
      - .github/workflows/python-tests.yaml
      - .github/workflows/python-reusable.yaml
  workflow_dispatch:
    inputs:
      wf_names:
        description: 'Workflows to test, comma separated (empty = all)'
        required: false
        default: ''
        type: string

# if you push twice quickly, cancel the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect workflows to test
    uses: ./.github/workflows/detect.yaml
    # the bot that syncs generated files (Dockerfiles, READMEs) is not a test trigger
    if: github.actor != 'github-actions[bot]'
    with:
      wf_names: ${{ github.event.inputs.wf_names || '' }}
      all_on_paths: '^\.github/workflows/(detect|python-tests|python-reusable)\.yaml$'

  test:
    name: ${{ matrix.wf }}
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.matrix != '[]'
    uses: ./.github/workflows/python-reusable.yaml
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    with:
      wf_name: ${{ matrix.wf }}
      runs_on: ${{ matrix.runs_on }}
