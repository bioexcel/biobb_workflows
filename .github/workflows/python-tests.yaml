name: Python workflow Tests

on:
  push:
    # test-what-you-changed: only the python (conda) flavour's own paths trigger it
    # (the always-on push trigger and the weekly full regression were removed
    # 2026-09-22 — see ci.md). GitHub allows only `paths` OR `paths-ignore` per event,
    # so the docker/singularity python flavours (workflow.docker.yml /
    # workflow.singularity.yml, exercised by python-container-tests.yaml) are excluded
    # by listing the conda-relevant files: the three standard config names are fixed
    # by biobb convention, and the step input data lives in tests/python/ (covered by
    # that glob). A change to only the two container configs must not re-run the
    # pure-python (conda) tests.
    paths:
      - 'biobb_wf_*/tests/python/**'
      - 'biobb_wf_*/python/workflow.yml'
      - 'biobb_wf_*/python/workflow.env.yml'
      - 'biobb_wf_*/python/workflow.py'
  workflow_dispatch:
    inputs:
      wf_names:
        description: 'Workflows to test, comma separated (empty = all)'
        required: false
        default: ''
        type: string

# if you push twice quickly, cancel the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect workflows to test
    uses: ./.github/workflows/detect.yaml
    # the bot that syncs generated files (Dockerfiles, READMEs) is not a test trigger
    if: github.actor != 'github-actions[bot]'
    with:
      wf_names: ${{ github.event.inputs.wf_names || '' }}
      # without a flavour, require_path is empty and every wf is eligible
      # (tests/<flavour>/SKIP is never consulted)
      flavour: python

  test:
    name: ${{ matrix.wf }}
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.matrix != '[]'
    uses: ./.github/workflows/python-reusable.yaml
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    with:
      wf_name: ${{ matrix.wf }}
      runs_on: ${{ matrix.runs_on }}
