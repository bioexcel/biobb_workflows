name: Drift daily check

# Every morning: can every environment we ship still be installed today, with the
# tools people use, on the platforms they use? Nothing is installed (dry-run solves
# only), so the whole run takes minutes. Results are compared with yesterday's and
# saved on the drift-snapshots branch; a single issue ("Drift: daily check") shows
# the current state and gets a comment only when something changed.
#
# Docs: docs/ci.md §1.1d. Scripts: common/drift/.
#
# Runs from a branch other than main (manual test runs) write to the
# drift-snapshots-test branch and the "Drift: daily check (test)" issue instead,
# and do not touch the scheduled workflows.

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

# a singleton (not a test/publish workflow): two runs must not race on the snapshot
# branch and the issue; a second run waits for the first
concurrency:
  group: drift-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Collect environments and runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Environment files (python flavour + jupyter repos on GitHub main)
        run: python3 common/drift/list_envs.py work
      - name: Colab and runner versions
        run: python3 common/drift/meta.py work
      - uses: actions/upload-artifact@v4
        with:
          name: drift-prepare
          path: work/
          retention-days: 7

  solve:
    name: Solve (${{ matrix.solver }}, ${{ matrix.platform }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # conda: what CI, the Docker images and most users use (same build as CI)
          - {solver: conda, platform: linux-64}
          - {solver: conda, platform: osx-64}
          - {solver: conda, platform: osx-arm64}
          # mamba: what the notebooks' Colab cell uses (Miniforge 26.1.0-0)
          - {solver: mamba, platform: linux-64}
          # micromamba: what many local users and setup-micromamba use (latest)
          - {solver: micromamba, platform: linux-64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drift-prepare
          path: work/

      - name: Install ${{ matrix.solver }}
        id: tool
        run: |
          case "${{ matrix.solver }}" in
            conda)
              curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-py312_26.7.1-0-Linux-x86_64.sh -o /tmp/inst.sh
              bash /tmp/inst.sh -b -p "$HOME/miniconda3"
              exe="$HOME/miniconda3/bin/conda"
              "$exe" config --set solver libmamba ;;
            mamba)
              curl -fsSL https://github.com/conda-forge/miniforge/releases/download/26.1.0-0/Miniforge3-26.1.0-0-Linux-x86_64.sh -o /tmp/inst.sh
              bash /tmp/inst.sh -b -p "$HOME/miniforge3"
              exe="$HOME/miniforge3/bin/mamba" ;;
            micromamba)
              mkdir -p "$HOME/mm"
              curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$HOME/mm" bin/micromamba
              exe="$HOME/mm/bin/micromamba"
              echo "MAMBA_ROOT_PREFIX=$HOME/mm/root" >> "$GITHUB_ENV" ;;
          esac
          "$exe" --version
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: Dry-run solve every environment
        run: |
          python3 common/drift/solve.py --solver ${{ matrix.solver }} \
            --exe "${{ steps.tool.outputs.exe }}" --platform ${{ matrix.platform }} \
            --work work --out out --jobs 3

      - uses: actions/upload-artifact@v4
        with:
          name: drift-solve-${{ matrix.solver }}-${{ matrix.platform }}
          path: out/
          retention-days: 7

  report:
    name: Compare, save snapshot, update issue
    needs: [prepare, solve]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the snapshot branch
      issues: write     # the drift issue
      actions: write    # re-enable scheduled workflows (60-day rule)
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: drift-*
          path: new/
          merge-multiple: true

      - name: Fetch previous snapshots
        id: snap
        run: |
          if [ "$ON_MAIN" = true ]; then branch=drift-snapshots; else branch=drift-snapshots-test; fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$url" "$branch" >/dev/null; then
            git clone --quiet --depth 1 --branch "$branch" "$url" snap
          else
            echo "No $branch branch yet: this run saves the first snapshot (baseline)"
            git init --quiet snap
            git -C snap checkout --quiet --orphan "$branch"
            git -C snap remote add origin "$url"
          fi

      - name: Compare
        id: cmp
        run: |
          missing=""
          if [ "${{ needs.solve.result }}" != success ]; then
            missing="One or more solve jobs did not finish (${{ needs.solve.result }}): their results are missing from today's comparison."
            echo "::warning::$missing"
          fi
          python3 common/drift/report.py --new new --prev snap/latest --green snap/last-green \
            --green-date "$(cat snap/last-green/DATE 2>/dev/null || true)" \
            --out rep --run-url "$RUN_URL"
          { [ -n "$missing" ] && printf '> ⚠️ %s\n\n' "$missing"; cat rep/report.md; } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json;d=json.load(open("rep/status.json"));[print(f"{k}={str(v).lower()}") for k,v in d.items()]' >> "$GITHUB_OUTPUT"

      - name: Start the Colab check when Colab changed
        if: env.ON_MAIN == 'true'
        run: |
          # Colab's Python/Ubuntu (backend-info) or Google's Colab image changed since the
          # previous snapshot: run the notebooks in Colab now, not on Saturday.
          old=snap/latest/meta/colab.txt; new=new/meta/colab.txt
          [ -f "$old" ] && [ -f "$new" ] || { echo "no previous Colab record"; exit 0; }
          key() { grep -E "^($1)=" "$2" | grep -v '=?$' | sort; }
          if [ "$(key 'python|ubuntu|image' "$old")" != "$(key 'python|ubuntu|image' "$new")" ]; then
            diff <(key 'python|ubuntu|image' "$old") <(key 'python|ubuntu|image' "$new") || true
            gh workflow run colab-check.yaml --repo "$REPO" && echo "Colab check started"
          else
            echo "Colab unchanged"
          fi

      - name: Save snapshot
        run: |
          today=$(date -u +%F)
          rm -rf snap/latest && cp -r new snap/latest && echo "$today" > snap/latest/DATE
          if [ "${{ steps.cmp.outputs.all_green }}" = true ]; then
            rm -rf snap/last-green && cp -r new snap/last-green && echo "$today" > snap/last-green/DATE
          fi
          cat > snap/README.md <<'EOF'
          # Drift snapshots

          Written every day by `.github/workflows/drift-daily.yaml` (docs/ci.md §1.1d).
          Do not edit by hand.

          - `latest/`: today's dry-run solves (`envs/<env>/<platform>__<tool>.txt`), the spec
            lists they came from (`specs/`), and the tool, runner and Colab versions (`meta/`).
          - `last-green/`: the same, from the last day when nothing was red.

          The git history of this branch is the day-by-day record: `git log -p -- latest/`.
          EOF
          cd snap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No change since the last snapshot"; exit 0; fi
          git commit --quiet -m "drift $today: ${{ steps.cmp.outputs.red }} red, ${{ steps.cmp.outputs.yellow }} yellow" \
            -m "$RUN_URL"
          git push --quiet origin "HEAD:${{ steps.snap.outputs.branch }}"

      - name: Update the drift issue
        env:
          ASSIGNEE: ${{ vars.DRIFT_ASSIGNEE }}
        run: |
          if [ "$ON_MAIN" = true ]; then title="Drift: daily check"; else title="Drift: daily check (test)"; fi
          bash common/drift/update_issue.sh "$title" rep/issue_body.md rep/comment.md \
            "${{ steps.cmp.outputs.red }}" "${{ steps.cmp.outputs.notable }}" "$RUN_URL"

      - name: Keep scheduled workflows enabled
        if: env.ON_MAIN == 'true'
        run: |
          # GitHub disables scheduled workflows in public repos after 60 days without
          # repository activity; re-enable those (state disabled_inactivity). A workflow
          # switched off ON PURPOSE (disabled_manually, e.g. jupyter-sync during a
          # release, see .claude/skills/biobb-release) is left alone.
          for wf in drift-daily python-tests python-container-tests cwl-tests airflow-tests \
                    nextflow-tests flavour-tests jupyter-tests galaxy-tests colab-check jupyter-sync citation; do
            state=$(gh api "repos/$REPO/actions/workflows/$wf.yaml" --jq .state 2>/dev/null || echo unknown)
            case "$state" in
              disabled_inactivity)
                gh api -X PUT "repos/$REPO/actions/workflows/$wf.yaml/enable" >/dev/null \
                  && echo "re-enabled $wf (was disabled for inactivity)" \
                  || echo "::warning::could not enable $wf" ;;
              disabled_manually) echo "::notice::$wf is disabled on purpose; left alone" ;;
              *) echo "$wf: $state" ;;
            esac
          done
