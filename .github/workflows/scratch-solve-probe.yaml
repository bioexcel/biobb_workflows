# SCRATCH — solve probe for the md_setup python-test failure. DELETE AFTER USE.
#
# Compares three solves of the same (or near-same) spec:
#   1. micromamba 2.9.0 (same tooling as the python test)      -> expected UNSAT (control)
#   2. conda 26.7.1 in continuumio/miniconda3 (same as the docker image build)
#   3. conda 26.7.1 on the jupyter repo's env file (without the 6 local pins)
#
# Read the three "PROBE n: SAT/UNSAT" lines in the job log.

name: Scratch solve probe (delete me)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe 1 — micromamba 2.9.0, current env file (control, expected UNSAT)
        id: mm
        continue-on-error: true
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "2.9.0"
          environment-file: biobb_wf_md_setup/python/workflow.env.yml
          create-args: "pytest imagehash"

      - name: Record probe 1
        if: always()
        run: |
          if [ "${{ steps.mm.outcome }}" = "success" ]; then
            echo "PROBE 1 (micromamba 2.9.0, current file): SAT"
          else
            echo "PROBE 1 (micromamba 2.9.0, current file): UNSAT"
          fi

      - name: Fetch jupyter repo env file
        run: |
          curl -fsSL https://raw.githubusercontent.com/bioexcel/biobb_wf_md_setup/main/conda_env/environment.yml -o /tmp/jupyter-env.yml
          cat /tmp/jupyter-env.yml

      - name: Probe 2 — conda 26.7.1 (miniconda3 image), current env file
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w:ro" continuumio/miniconda3 bash -c '
            conda config --set solver libmamba &&
            conda create -n probe2 -f /w/biobb_wf_md_setup/python/workflow.env.yml pytest imagehash --dry-run
          ' > /tmp/probe2.log 2>&1 && rc=0 || rc=1
          grep -E "gromacs-20|libhwloc|libxml2|openbabel|acpype|ambertools|icu-|zlib-|libzlib|cpython" /tmp/probe2.log | head -20
          if [ "$rc" -eq 0 ]; then
            echo "PROBE 2 (conda 26.7.1, current file): SAT"
          else
            echo "PROBE 2 (conda 26.7.1, current file): UNSAT"
            grep -A 30 "Could not solve\|incompatible" /tmp/probe2.log | head -60
            exit 0
          fi

      - name: Probe 3 — conda 26.7.1 (miniconda3 image), jupyter repo env file (no local pins)
        run: |
          docker run --rm -v /tmp:/t continuumio/miniconda3 bash -c '
            conda config --set solver libmamba &&
            conda create -n probe3 -f /t/jupyter-env.yml pytest imagehash --dry-run
          ' > /tmp/probe3.log 2>&1 && rc=0 || rc=1
          grep -E "gromacs-20|libhwloc|libxml2|openbabel|acpype|ambertools|icu-|zlib-|libzlib|cpython" /tmp/probe3.log | head -20
          if [ "$rc" -eq 0 ]; then
            echo "PROBE 3 (conda 26.7.1, jupyter file): SAT"
          else
            echo "PROBE 3 (conda 26.7.1, jupyter file): UNSAT"
            grep -A 30 "Could not solve\|incompatible" /tmp/probe3.log | head -60
            exit 0
          fi
