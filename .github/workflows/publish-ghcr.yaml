name: Docker Image CI for GHCR

on:
  push:
    branches:
      - main
    paths:
      - common/docker/Dockerfile
  workflow_dispatch:
    inputs:
      wf:
        description: 'Workflow image to build (all = every image)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - biobb_wf_amber_abc_setup
          - biobb_wf_amber_md_setup
          - biobb_wf_amber_md_setup_lig
          - biobb_wf_autoencoder
          - biobb_wf_cmip
          - biobb_wf_dna_helparms
          - biobb_wf_flexdyn
          - biobb_wf_flexserv
          - biobb_wf_godmd
          - biobb_wf_haddock
          - biobb_wf_ligand_parameterization
          - biobb_wf_md_setup
          - biobb_wf_md_setup_mutations
          - biobb_wf_mem
          - biobb_wf_pmx_tutorial
          - biobb_wf_protein_md_analysis
          - biobb_wf_protein-complex_md_setup
          - biobb_wf_virtual-screening_fpocket

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Filters the full image list down to the selected workflow (push trigger
  # or 'all' => every image). A job-level 'if' cannot use the matrix context,
  # so the selection happens here and feeds the build matrix dynamically.
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select workflow images to build
        id: select
        env:
          WF: ${{ inputs.wf }}
        run: |
          cat > images.json <<'EOF'
          [
            {"wf": "biobb_wf_amber_abc_setup", "args": "--build-arg REPO=biobb_wf_amber --build-arg SUBREPO=abc_setup"},
            {"wf": "biobb_wf_amber_md_setup", "args": "--build-arg REPO=biobb_wf_amber --build-arg SUBREPO=md_setup"},
            {"wf": "biobb_wf_amber_md_setup_lig", "args": "--build-arg REPO=biobb_wf_amber --build-arg SUBREPO=md_setup_lig"},
            {"wf": "biobb_wf_autoencoder", "args": "--build-arg REPO=biobb_wf_autoencoder"},
            {"wf": "biobb_wf_cmip", "args": "--build-arg REPO=biobb_wf_cmip"},
            {"wf": "biobb_wf_dna_helparms", "args": "--build-arg REPO=biobb_wf_dna_helparms"},
            {"wf": "biobb_wf_flexdyn", "args": "--build-arg REPO=biobb_wf_flexdyn"},
            {"wf": "biobb_wf_flexserv", "args": "--build-arg REPO=biobb_wf_flexserv"},
            {"wf": "biobb_wf_godmd", "args": "--build-arg REPO=biobb_wf_godmd"},
            {"wf": "biobb_wf_haddock", "args": "--build-arg REPO=biobb_wf_haddock"},
            {"wf": "biobb_wf_ligand_parameterization", "args": "--build-arg REPO=biobb_wf_ligand_parameterization"},
            {"wf": "biobb_wf_md_setup", "args": "--build-arg REPO=biobb_wf_md_setup"},
            {"wf": "biobb_wf_md_setup_mutations", "args": "--build-arg REPO=biobb_wf_md_setup_mutations"},
            {"wf": "biobb_wf_mem", "args": "--build-arg REPO=biobb_wf_mem"},
            {"wf": "biobb_wf_pmx_tutorial", "args": "--build-arg REPO=biobb_wf_pmx_tutorial"},
            {"wf": "biobb_wf_protein_md_analysis", "args": "--build-arg REPO=biobb_wf_protein_md_analysis"},
            {"wf": "biobb_wf_protein-complex_md_setup", "args": "--build-arg REPO=biobb_wf_protein-complex_md_setup"},
            {"wf": "biobb_wf_virtual-screening_fpocket", "args": "--build-arg REPO=biobb_wf_virtual-screening --build-arg SUBREPO=fpocket"}
          ]
          EOF
          if [ -z "$WF" ] || [ "$WF" = "all" ]; then
            SEL="$(cat images.json)"
          else
            SEL="$(python3 -c '
          import json, os
          wf = os.environ["WF"]
          data = json.load(open("images.json"))
          sel = [e for e in data if e["wf"] == wf]
          if not sel:
              raise SystemExit(f"unknown workflow: {wf}")
          print(json.dumps(sel))
          ')"
          fi
          {
            echo "matrix<<SELECTED_EOF"
            echo "$SEL"
            echo "SELECTED_EOF"
          } >> "$GITHUB_OUTPUT"

  build_and_publish:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      # one image failing (e.g. a bad tool version) must not stop the rest
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # docker.yaml (which commits the per-workflow Dockerfiles) may run in
      # parallel and not have landed yet — regenerate locally so the build
      # always matches the current template.
      - name: Sync per-workflow Dockerfiles from template (local only, not committed)
        run: bash common/docker/sync_dockerfiles.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract version from Dockerfile
        id: extract_version
        run: |
          VERSION=$(grep 'LABEL version=' common/docker/Dockerfile | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build and push ${{ matrix.wf }} image
        run: |
          cd ${{ matrix.wf }}/docker
          docker build ${{ matrix.args }} -t ghcr.io/bioexcel/${{ matrix.wf }}:${{ env.VERSION }} -t ghcr.io/bioexcel/${{ matrix.wf }}:latest .
          docker push ghcr.io/bioexcel/${{ matrix.wf }}:${{ env.VERSION }}
          docker push ghcr.io/bioexcel/${{ matrix.wf }}:latest
          docker rmi ghcr.io/bioexcel/${{ matrix.wf }}:${{ env.VERSION }}
          docker rmi ghcr.io/bioexcel/${{ matrix.wf }}:latest
          docker system prune -f
