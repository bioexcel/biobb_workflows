name: Docker Image CI for GHCR

# Test-gated, per-workflow image publishing:
#   push touching common/docker/**            -> all workflows
#   push touching biobb_wf_X/docker/**        -> workflow X
#   workflow_dispatch (wf input)              -> the chosen workflow (or all)
#
# Chain: detect -> select -> docker e2e test(s) -> publish (only if every
# selected test passed; skipped when no test exists for the selection).
# Each image is tagged with its own version: <wf>/docker/VERSION if present,
# else the template's LABEL version=.

on:
  push:
    branches:
      - main
    paths:
      - common/docker/**
      - 'biobb_wf_*/docker/**'
  workflow_dispatch:
    inputs:
      wf:
        description: 'Workflow image to build (all = every image)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - biobb_wf_amber_abc_setup
          - biobb_wf_amber_md_setup
          - biobb_wf_amber_md_setup_lig
          - biobb_wf_autoencoder
          - biobb_wf_cmip
          - biobb_wf_dna_helparms
          - biobb_wf_flexdyn
          - biobb_wf_flexserv
          - biobb_wf_godmd
          - biobb_wf_haddock
          - biobb_wf_ligand_parameterization
          - biobb_wf_md_setup
          - biobb_wf_md_setup_mutations
          - biobb_wf_mem
          - biobb_wf_pmx_tutorial
          - biobb_wf_protein_md_analysis
          - biobb_wf_protein-complex_md_setup
          - biobb_wf_virtual-screening_fpocket
      skip_tests:
        description: 'Skip the docker e2e tests (rebuild only — not recommended)'
        required: false
        default: false
        type: boolean

# a re-dispatch / new push of the same ref cancels the in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect workflows to publish
    # the bot that commits the regenerated per-wf Dockerfiles (docker.yaml) is
    # the follow-up of the same change — do not start a second chain for it
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/detect.yaml
    with:
      wf_names: ${{ github.event.inputs.wf || '' }}
      # any change under common/docker (template, sync script) affects every image
      all_on_paths: '^common/docker/'

  # Maps the selection to (a) the publish matrix (wf + build args) and
  # (b) the test matrix (wfs that have a docker e2e script and no
  #     tests/docker/SKIP opt-out file; a SKIP-ed wf publishes untested).
  select:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    outputs:
      publish_matrix: ${{ steps.select.outputs.publish_matrix }}
      test_matrix: ${{ steps.select.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@v3
      - id: select
        env:
          SELECTED: ${{ needs.detect.outputs.matrix }}
        run: |
          cat > images.json <<'EOF'
          [
            {"wf": "biobb_wf_amber_abc_setup", "args": "--build-arg REPO=biobb_wf_amber --build-arg SUBREPO=abc_setup"},
            {"wf": "biobb_wf_amber_md_setup", "args": "--build-arg REPO=biobb_wf_amber --build-arg SUBREPO=md_setup"},
            {"wf": "biobb_wf_amber_md_setup_lig", "args": "--build-arg REPO=biobb_wf_amber --build-arg SUBREPO=md_setup_lig"},
            {"wf": "biobb_wf_autoencoder", "args": "--build-arg REPO=biobb_wf_autoencoder"},
            {"wf": "biobb_wf_cmip", "args": "--build-arg REPO=biobb_wf_cmip"},
            {"wf": "biobb_wf_dna_helparms", "args": "--build-arg REPO=biobb_wf_dna_helparms"},
            {"wf": "biobb_wf_flexdyn", "args": "--build-arg REPO=biobb_wf_flexdyn"},
            {"wf": "biobb_wf_flexserv", "args": "--build-arg REPO=biobb_wf_flexserv"},
            {"wf": "biobb_wf_godmd", "args": "--build-arg REPO=biobb_wf_godmd"},
            {"wf": "biobb_wf_haddock", "args": "--build-arg REPO=biobb_wf_haddock"},
            {"wf": "biobb_wf_ligand_parameterization", "args": "--build-arg REPO=biobb_wf_ligand_parameterization"},
            {"wf": "biobb_wf_md_setup", "args": "--build-arg REPO=biobb_wf_md_setup"},
            {"wf": "biobb_wf_md_setup_mutations", "args": "--build-arg REPO=biobb_wf_md_setup_mutations"},
            {"wf": "biobb_wf_mem", "args": "--build-arg REPO=biobb_wf_mem"},
            {"wf": "biobb_wf_pmx_tutorial", "args": "--build-arg REPO=biobb_wf_pmx_tutorial"},
            {"wf": "biobb_wf_protein_md_analysis", "args": "--build-arg REPO=biobb_wf_protein_md_analysis"},
            {"wf": "biobb_wf_protein-complex_md_setup", "args": "--build-arg REPO=biobb_wf_protein-complex_md_setup"},
            {"wf": "biobb_wf_virtual-screening_fpocket", "args": "--build-arg REPO=biobb_wf_virtual-screening --build-arg SUBREPO=fpocket"}
          ]
          EOF
          python3 - <<'PY'
          import json, os

          selected = json.loads(os.environ.get("SELECTED") or "[]")
          wfs = [e["wf"] for e in selected]
          known = {e["wf"]: e for e in json.load(open("images.json"))}

          publish = [known[w] for w in wfs if w in known]
          skipped = [w for w in wfs if w not in known]
          if skipped:
              print("::warning::No GHCR image entry for: " + ", ".join(skipped))

          test = []
          for w in wfs:
              if not os.path.exists(os.path.join(w, "tests", "docker", "run_test.sh")):
                  continue
              skip = os.path.join(w, "tests", "docker", "SKIP")
              if os.path.exists(skip):
                  reason = open(skip).read().strip().splitlines()[0]
                  print("::warning::docker e2e of " + w + " is opted out (tests/docker/SKIP): " + reason)
                  continue
              test.append({"wf": w, "runs_on": "ubuntu-latest"})

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("publish_matrix=" + json.dumps(publish) + "\n")
              f.write("test_matrix=" + json.dumps(test) + "\n")
          print(f"publish: {[e['wf'] for e in publish] or '(none)'}")
          print(f"test:    {[e['wf'] for e in test] or '(none)'}")
          PY

  # docker e2e for every selected workflow that has the script
  test:
    needs: [detect, select]
    if: needs.select.outputs.test_matrix != '[]' && inputs.skip_tests != true
    name: docker e2e ${{ matrix.wf }}
    uses: ./.github/workflows/flavour-test-reusable.yaml
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.test_matrix) }}
    with:
      wf_name: ${{ matrix.wf }}
      flavour: docker
      runs_on: ${{ matrix.runs_on }}

  publish:
    needs: [detect, select, test]
    # run-level gate: publish only if every selected docker e2e passed (or
    # none ran). One red test => nothing is published in this run.
    if: >-
      always()
      && needs.select.result == 'success'
      && needs.select.outputs.publish_matrix != '[]'
      && (inputs.skip_tests == true
          || needs.test.result == 'success'
          || needs.test.result == 'skipped')
    name: publish ${{ matrix.wf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.publish_matrix) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # docker.yaml (which commits the per-workflow Dockerfiles) may run in
      # parallel and not have landed yet — regenerate locally so the build
      # always matches the current template.
      - name: Sync per-workflow Dockerfiles from template (local only, not committed)
        run: bash common/docker/sync_dockerfiles.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Extract version (per-workflow VERSION file, else template label)
        id: extract_version
        run: |
          VERSION_FILE="${{ matrix.wf }}/docker/VERSION"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION="$(tr -d '[:space:]' < "$VERSION_FILE")"
          else
            VERSION="$(grep 'LABEL version=' ${{ matrix.wf }}/docker/Dockerfile | cut -d '"' -f 2)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build and push ${{ matrix.wf }} image
        run: |
          cd ${{ matrix.wf }}/docker
          docker build ${{ matrix.args }} -t ghcr.io/bioexcel/${{ matrix.wf }}:${{ env.VERSION }} -t ghcr.io/bioexcel/${{ matrix.wf }}:latest .
          docker push ghcr.io/bioexcel/${{ matrix.wf }}:${{ env.VERSION }}
          docker push ghcr.io/bioexcel/${{ matrix.wf }}:latest
          docker rmi ghcr.io/bioexcel/${{ matrix.wf }}:${{ env.VERSION }}
          docker rmi ghcr.io/bioexcel/${{ matrix.wf }}:latest
          docker system prune -f
