name: Python workflow Tests (container flavours)

on:
  push:
    # Trigger only on the workflows that ship docker/singularity python workflows,
    # and only on what these flavours actually consume: the two container configs,
    # the env (pip-installed), and the python test files (the wrappers import the
    # standard step functions). The plain workflow.yml / workflow.py are NOT used
    # here, so changes to them must not fire this pipeline.
    # When another workflow gains workflow.docker.yml / workflow.singularity.yml,
    # add its paths here AND a matching entry to the matrix below.
    paths:
      - 'biobb_wf_md_setup/python/workflow.docker.yml'
      - 'biobb_wf_md_setup/python/workflow.singularity.yml'
      - 'biobb_wf_md_setup/python/workflow.env.yml'
      - 'biobb_wf_md_setup/tests/python/**'
      - 'biobb_wf_ligand_parameterization/python/workflow.docker.yml'
      - 'biobb_wf_ligand_parameterization/python/workflow.singularity.yml'
      - 'biobb_wf_ligand_parameterization/python/workflow.env.yml'
      - 'biobb_wf_ligand_parameterization/tests/python/**'
  workflow_dispatch:

# if you push twice quickly, cancel the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-test:
    name: ${{ matrix.wf }} (${{ matrix.variant }})
    # the bot that syncs generated files (Dockerfiles, READMEs) is not a test trigger
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      # one job per (workflow, flavour); don't abort the others if one fails
      fail-fast: false
      matrix:
        include:
          - wf: biobb_wf_md_setup
            variant: docker
          - wf: biobb_wf_md_setup
            variant: singularity
          - wf: biobb_wf_ligand_parameterization
            variant: docker
          - wf: biobb_wf_ligand_parameterization
            variant: singularity
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # pip-installs the biobb packages from workflow.env.yml into a venv and runs
      # the step-by-step test against workflow.<variant>.yml (each step's binaries
      # run in a container pulled by biobb per step). For singularity the script
      # warms SINGULARITY_CACHE with the unique images first, so a package with many
      # steps downloads one image, not one per step.
      #
      # NOTE (singularity): biobb runs 'singularity exec' as the non-root CI user, so
      # the runner must allow unprivileged user namespaces (GH ubuntu-latest does by
      # default).
      - name: pip + ${{ matrix.variant }}
        run: |
          bash ${{ matrix.wf }}/tests/python/run_container_test.sh ${{ matrix.variant }} ${{ matrix.wf }}
