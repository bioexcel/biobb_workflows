name: Jupyter repo probe (daily)

# The docker image fetches the jupyter repo's conda env + tutorial notebook from
# main at build time, and the jupyter e2e runs that notebook — but a push to a
# jupyter repo (separate bioexcel/<wf> repos) cannot trigger this repo's
# workflows. This probe closes the gap. For every jupyter submodule,
# grouped by repo (the three amber sub-wfs share bioexcel/biobb_wf_amber):
#
#   1. ls-remote the repo's main and compare with the committed submodule pointer
#   2. on advance, clone it and diff old..new, then:
#        - pointer bump: ALWAYS (bot commit — keeps local checkouts current)
#        - jupyter e2e:  ALWAYS (the repo the notebook lives in changed)
#        - image rebuild + publish (the chain): if conda_env/environment.yml
#          changed (all wfs sharing the repo — they share the env) OR that wf's
#          tutorial notebook changed. The chain runs ONLY AFTER the jupyter e2e
#          passed, so a broken notebook can never be published (the chain's own
#          docker e2e runs workflow.py, not the notebook).
#   3. clone/diff failure -> no bump, retry on the next run (a failed analysis
#      must not silently skip the env check)
#
# Triggers: daily cron AND pushes to main touching a workflow's `python/`
# folder or its `jupyter` submodule pointer — the two sides that must stay in
# sync (they pin the same biobb_* versions; that is the relationship this
# probe guards). A cwl/airflow/docs push doesn't touch that relationship, so
# it no longer triggers the probe: a jupyter-repo advance that doesn't
# coincide with such a push is picked up by the daily cron instead (<= 24 h).
# Early on the `schedule` triggers looked dead (zero schedule runs in 90
# days), but a schedule run DID fire on 2026-09-23 at 14:15 (delayed 14:00
# tick), so the cron is alive; the push trigger stays as a safety net. The
# probe is a ~30 s no-op when nothing advanced (a few git ls-remote calls),
# so a run per relevant push is nearly free. No loop: the probe's own bot
# pointer-bump push re-triggers it (it touches a `jupyter` pointer path),
# finds pointer == remote and exits. `concurrency` (cancel-in-progress)
# collapses overlapping runs.
#
# No secrets needed: public ls-remote / clone of public repos.

on:
  schedule:
    - cron: '0 14 * * *'
  push:
    branches: [main]
    paths:
      - 'biobb_wf_*/python/**'
      - 'biobb_wf_*/jupyter'
      - 'biobb_wf_*/jupyter/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe jupyter repos
    runs-on: ubuntu-latest
    outputs:
      bump_plan: ${{ steps.probe.outputs.bump_plan }}
      e2e_wfs: ${{ steps.probe.outputs.e2e_wfs }}
      chain_wfs: ${{ steps.probe.outputs.chain_wfs }}
    steps:
      - uses: actions/checkout@v4

      - id: probe
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess

          def git(*args, cwd=None):
              return subprocess.run(["git", *args], cwd=cwd,
                                    capture_output=True, text=True)

          # group the jupyter submodules by their repo URL (the amber sub-wfs
          # all point at bioexcel/biobb_wf_amber). config --get-regexp keys
          # differ by suffix (submodule.X.path / submodule.X.url), so strip it
          r = git("config", "-f", ".gitmodules", "--get-regexp",
                  r"submodule\..*\.path")
          paths = {}
          for line in r.stdout.splitlines():
              key, val = line.split(" ", 1)
              if val.endswith("/jupyter"):
                  paths[key.rsplit(".", 1)[0]] = val
          r = git("config", "-f", ".gitmodules", "--get-regexp",
                  r"submodule\..*\.url")
          urls = {}
          for line in r.stdout.splitlines():
              key, val = line.split(" ", 1)
              urls[key.rsplit(".", 1)[0]] = val
          groups = {}
          for name, path in paths.items():
              url = urls.get(name, "")
              if url:
                  groups.setdefault(url, []).append(path.rsplit("/jupyter", 1)[0])

          bump_plan, e2e, chain = [], [], []
          for url, wfs in sorted(groups.items()):
              repo = url.rstrip("/").rsplit("/", 1)[-1]
              if repo.endswith(".git"):
                  repo = repo[:-4]
              pointers = []
              for w in wfs:
                  r = git("ls-tree", "HEAD", w + "/jupyter")
                  pointers.append(r.stdout.split()[2]
                                  if r.returncode == 0 and r.stdout.strip() else "")
              old = next((p for p in pointers if p), "")
              if not old:
                  print("::warning::no submodule pointer for "
                        + ", ".join(wfs) + " (" + url + ")")
                  continue
              if len(set(pointers)) > 1:
                  print("::warning::inconsistent pointers in " + ", ".join(wfs)
                        + " — diffing against " + old[:7])
              r = subprocess.run(["git", "ls-remote", url, "refs/heads/main"],
                                 capture_output=True, text=True)
              if r.returncode != 0 or not r.stdout.strip():
                  print("::warning::ls-remote failed for " + url + ": "
                        + r.stderr.strip())
                  continue
              new = r.stdout.split()[0]
              if new == old:
                  continue
              print(url + " advanced " + old[:7] + ".." + new[:7]
                    + " (" + ", ".join(wfs) + ")")
              clone = "/tmp/jupyter_probe"
              shutil.rmtree(clone, ignore_errors=True)
              if git("clone", "--quiet", url, clone).returncode != 0:
                  print("::warning::clone failed for " + url
                        + " — no bump, retrying next run")
                  continue
              r = git("diff", "--name-only", old + ".." + new, cwd=clone)
              if r.returncode == 0:
                  changed = set(r.stdout.split())
                  env_changed = "conda_env/environment.yml" in changed
                  print("changed: " + (", ".join(sorted(changed)) or "(none)"))
              else:
                  # old pointer unreachable (force-push on the jupyter repo):
                  # assume the env may have changed — a rebuild is always safe
                  changed = set()
                  env_changed = True
                  print("::warning::cannot diff " + old[:7] + ".." + new[:7]
                        + " (old pointer unreachable?) — assuming env changed")

              # the tutorial notebook the image bakes in (common/docker/Dockerfile):
              # plain wf:  <repo>/notebooks/<repo>.ipynb
              # sub wf:    <repo>/notebooks/<sub>/<repo>_<sub>.ipynb  (sub = wf minus
              #             the "<repo>_" prefix, e.g. the amber sub-wfs)
              def notebook_of(w):
                  if w == repo:
                      return repo + "/notebooks/" + w + ".ipynb"
                  if w.startswith(repo + "_"):
                      return repo + "/notebooks/" + w[len(repo) + 1:] + "/" + w + ".ipynb"
                  return ""

              for w in wfs:
                  bump_plan.append({"wf": w, "path": w + "/jupyter", "sha": new})
                  e2e.append(w)
                  nb = notebook_of(w)
                  nb_changed = bool(nb) and nb in changed
                  if env_changed or nb_changed:
                      chain.append(w)
                      why = "rebuild: env changed" if env_changed else "rebuild: notebook changed"
                  else:
                      why = "no rebuild (env and notebook unchanged)"
                  print(w + ": " + why + (" [notebook " + nb + "]" if nb else " [no notebook]"))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("bump_plan=" + json.dumps(bump_plan) + "\n")
              f.write("e2e_wfs=" + ",".join(sorted(set(e2e))) + "\n")
              f.write("chain_wfs=" + ",".join(sorted(set(chain))) + "\n")
          print("bump:  " + str([e["wf"] for e in bump_plan] or "(none)"))
          print("e2e:   " + (", ".join(sorted(set(e2e))) or "(none)"))
          print("chain: " + (", ".join(sorted(set(chain))) or "(none)"))
          PY

      # runs daily, change or not: the python flavour env (this repo) and the
      # image env (jupyter repo) are supposed to pin the same biobb_* versions —
      # nothing else checks that, so warn on drift ("bumped one side, forgot the
      # other"). Non-biobb packages (jupyter stack, ...) are ignored on purpose.
      - name: Check biobb_* pin drift (this repo env vs jupyter repo env)
        run: |
          python3 - <<'PY'
          import os, re, subprocess, urllib.request

          def pins(lines):
              d = {}
              for line in lines:
                  m = re.match(r"\s*-\s*(biobb_[a-z_]+)\s*=\s*=?([A-Za-z0-9._\-+]+)", line)
                  if m:
                      d[m.group(1)] = m.group(2)
              return d

          def cfg(regexp):
              r = subprocess.run(["git", "config", "-f", ".gitmodules",
                                  "--get-regexp", regexp],
                                 capture_output=True, text=True)
              return [l.split(" ", 1) for l in r.stdout.splitlines()]

          urls = {k.rsplit(".", 1)[0]: v
                  for k, v in cfg(r"submodule\..*\.url")}
          pairs = set()
          for k, v in cfg(r"submodule\..*\.path"):
              if v.endswith("/jupyter"):
                  url = urls.get(k.rsplit(".", 1)[0], "")
                  if url:
                      repo = url.rsplit("/", 1)[-1]
                      if repo.endswith(".git"):
                          repo = repo[:-4]
                      pairs.add((v.rsplit("/jupyter", 1)[0], repo))

          bad = 0
          for wf, repo in sorted(pairs):
              try:
                  local = open(os.path.join(wf, "python", "workflow.env.yml")).read()
              except FileNotFoundError:
                  print("::warning::" + wf + ": no python/workflow.env.yml — skipping")
                  bad += 1
                  continue
              raw = ("https://raw.githubusercontent.com/bioexcel/" + repo +
                     "/main/conda_env/environment.yml")
              try:
                  remote = urllib.request.urlopen(raw, timeout=30).read().decode()
              except Exception as e:
                  print("::warning::" + wf + ": could not fetch " + raw + " (" + str(e) + ")")
                  bad += 1
                  continue
              a, b = pins(local.splitlines()), pins(remote.splitlines())
              mismatch, only_here, only_jupyter = [], [], []
              for pkg in sorted(set(a) | set(b)):
                  if pkg in a and pkg in b:
                      if a[pkg] != b[pkg]:
                          mismatch.append(pkg + ": " + a[pkg] + " vs " + b[pkg])
                  elif pkg in a:
                      only_here.append(pkg + " " + a[pkg])
                  else:
                      only_jupyter.append(pkg + " " + b[pkg])
              if mismatch:
                  print("::warning::" + wf + " — biobb_* version drift (this repo vs "
                        + repo + "): " + "; ".join(mismatch))
                  bad += 1
              extras = []
              if only_here:
                  extras.append("only in this repo: " + ", ".join(only_here))
              if only_jupyter:
                  extras.append("only in jupyter env: " + ", ".join(only_jupyter))
              if extras:
                  print(wf + " — " + " | ".join(extras))
          print("drift check done: " + str(len(pairs)) + " jupyter repos, "
                + str(bad) + " warning(s)")
          PY

  commit-pointers:
    name: Bump jupyter submodule pointers
    needs: probe
    if: needs.probe.outputs.bump_plan != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-murray/workflow-application-token-action@v3
        id: generate_token
        with:
          application_id: ${{ vars.GHAPUSH }}
          application_private_key: ${{ secrets.GHAPUSH }}
      - uses: actions/checkout@v3
        with:
          token: ${{ steps.generate_token.outputs.token }}
      - name: Stage and commit the new pointers
        env:
          BUMP_PLAN: ${{ needs.probe.outputs.bump_plan }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, os, subprocess
          for e in json.loads(os.environ["BUMP_PLAN"]):
              subprocess.run(["git", "update-index", "--cacheinfo",
                              "160000," + e["sha"] + "," + e["path"]],
                             check=True)
          PY
          if git diff --cached --quiet; then
            echo "Pointers already up to date"
          else
            git commit -m "chore: sync jupyter submodule pointers (daily probe)" \
              && git push
          fi

  # the bot push of the pointer bump is ignored by every test workflow
  # (github-actions[bot] guard), so these calls are the only e2e runs
  jupyter-e2e:
    name: jupyter e2e (${{ needs.probe.outputs.e2e_wfs }})
    needs: probe
    if: needs.probe.outputs.e2e_wfs != ''
    uses: ./.github/workflows/jupyter-tests.yaml
    with:
      wf_names: ${{ needs.probe.outputs.e2e_wfs }}

  # after the e2e: a broken notebook can never reach the image
  publish:
    name: "rebuild + publish (env/notebook changed: ${{ needs.probe.outputs.chain_wfs }})"
    needs: [probe, jupyter-e2e]
    if: >-
      needs.probe.outputs.chain_wfs != ''
      && (needs.jupyter-e2e.result == 'success'
          || needs.jupyter-e2e.result == 'skipped')
    uses: ./.github/workflows/publish-ghcr.yaml
    with:
      wf_names: ${{ needs.probe.outputs.chain_wfs }}
