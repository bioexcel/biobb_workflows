name: Flavour e2e Test (reusable)

# Runs one workflow's e2e test:
#   docker / cwl / airflow / jupyter -> <wf>/tests/<flavour>/run_test.sh
#   python                           -> delegates to python-reusable.yaml (the
#                                       CI python pipeline, incl. per-wf
#                                       runtime reductions) — no drift

on:
  workflow_call:
    inputs:
      wf_name:
        required: true
        type: string
      flavour:
        description: 'docker | cwl | airflow | jupyter | python'
        required: true
        type: string
      runs_on:
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  python:
    name: ${{ inputs.wf_name }} (python)
    if: inputs.flavour == 'python'
    uses: ./.github/workflows/python-reusable.yaml
    with:
      wf_name: ${{ inputs.wf_name }}
      runs_on: ${{ inputs.runs_on }}

  flavour:
    name: ${{ inputs.wf_name }} (${{ inputs.flavour }})
    if: inputs.flavour != 'python'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 720
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up cwltool (cwl flavour only)
        if: inputs.flavour == 'cwl'
        uses: mamba-org/setup-micromamba@v2.0.0
        with:
          micromamba-version: '2.0.2-2'
          # required by the action whenever create-args is set
          environment-name: cwl
          create-args: >-
            cwltool

      - name: Run ${{ inputs.flavour }} e2e test for ${{ inputs.wf_name }}
        shell: bash -l {0}
        working-directory: ${{ inputs.wf_name }}/tests/${{ inputs.flavour }}
        run: ./run_test.sh
