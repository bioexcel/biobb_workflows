name: Flavour e2e Test (reusable)

# Runs one workflow's e2e test:
#   docker / cwl / airflow / jupyter / nextflow -> <wf>/tests/<flavour>/run_test.sh
#   python                                      -> delegates to python-reusable.yaml (the
#                                                  CI python pipeline, incl. per-wf
#                                                  runtime reductions) — no drift

on:
  workflow_call:
    inputs:
      wf_name:
        required: true
        type: string
      flavour:
        description: 'docker | cwl | airflow | jupyter | nextflow | galaxy | python'
        required: true
        type: string
      runs_on:
        required: false
        type: string
        default: 'ubuntu-latest'
      cancel_stale:
        description: 'Cancel an in-flight test of the SAME workflow folder + flavour (same caller and ref) when a newer one starts. Gated chains (publish-ghcr, jupyter-sync) pass false so a sibling wf in the same run never loses its publish.'
        required: false
        type: boolean
        default: true
    secrets:
      GALAXY_API_KEY:
        required: false

jobs:
  python:
    name: ${{ inputs.wf_name }} (python)
    if: inputs.flavour == 'python'
    uses: ./.github/workflows/python-reusable.yaml
    with:
      wf_name: ${{ inputs.wf_name }}
      runs_on: ${{ inputs.runs_on }}
      cancel_stale: ${{ inputs.cancel_stale != false }}

  flavour:
    name: ${{ inputs.wf_name }} (${{ inputs.flavour }})
    if: inputs.flavour != 'python'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 720
    # Per-folder concurrency (see python-reusable.yaml): different wfs never
    # cancel each other; github.workflow is the CALLER's name.
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.flavour }}-${{ github.ref }}-${{ inputs.wf_name }}
      cancel-in-progress: ${{ inputs.cancel_stale != false }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up cwltool (cwl flavour only)
        if: inputs.flavour == 'cwl'
        uses: mamba-org/setup-micromamba@v2.0.0
        with:
          micromamba-version: '2.0.2-2'
          # required by the action whenever create-args is set
          environment-name: cwl
          create-args: >-
            cwltool

      # Same Nextflow as the local runs the generated workflows were tested with
      # (their main.nf needs >=25.10: workflow outputs)
      - name: Set up Java (nextflow flavour only)
        if: inputs.flavour == 'nextflow'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Nextflow (nextflow flavour only)
        if: inputs.flavour == 'nextflow'
        uses: nf-core/setup-nextflow@v2
        with:
          version: '26.10.3'

      - name: Run ${{ inputs.flavour }} e2e test for ${{ inputs.wf_name }}
        shell: bash -l {0}
        env:
          # galaxy flavour only: enables the run on the BioBB Galaxy server (optional
          # secret; callers pass it with `secrets: inherit`, empty otherwise). Only when
          # the repository variable GALAXY_RUN is 'true': off since 2026-11-26 until INB
          # fixes the server's _ext wrappers (docs/testing.md §2.3); the tool check still runs.
          GALAXY_API_KEY: ${{ vars.GALAXY_RUN == 'true' && secrets.GALAXY_API_KEY || '' }}
          # wait at most 5.5 h for the server's jobs: a GitHub-hosted job is killed at 6 h
          # (whatever timeout-minutes says), and then galaxy_wf.py could not clean up
          GALAXY_TIMEOUT_MIN: '330'
        working-directory: ${{ inputs.wf_name }}/tests/${{ inputs.flavour }}
        run: ./run_test.sh

      # On failure, tar the test work dir (recorded by run_test.sh in
      # .e2e_workdir) and upload it: the sander/cwl/airflow logs behind a
      # failing step live there and are gone otherwise.
      - name: Tar e2e workdir on failure
        if: failure()
        shell: bash -l {0}
        run: |
          MARKER="${{ inputs.wf_name }}/tests/${{ inputs.flavour }}/.e2e_workdir"
          [[ -f "$MARKER" ]] || exit 0
          WD="$(cat "$MARKER")"
          [[ -d "$WD" ]] || exit 0
          # skip unreasonably large work dirs (keep the runner usable)
          [[ "$(du -sb "$WD" | cut -f1)" -lt 1073741824 ]] || exit 0
          tar -czf "$RUNNER_TEMP/e2e_workdir.tar.gz" \
            -C "$(dirname "$WD")" "$(basename "$WD")" || true

      - name: Upload e2e workdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-workdir-${{ inputs.wf_name }}-${{ inputs.flavour }}
          path: ${{ runner.temp }}/e2e_workdir.tar.gz
          if-no-files-found: ignore
