name: Flavour e2e Test (reusable)

# Runs one workflow's e2e test:
#   docker / cwl / airflow / jupyter -> <wf>/tests/<flavour>/run_test.sh
#   python                           -> delegates to python-reusable.yaml (the
#                                       CI python pipeline, incl. per-wf
#                                       runtime reductions) — no drift

on:
  workflow_call:
    inputs:
      wf_name:
        required: true
        type: string
      flavour:
        description: 'docker | cwl | airflow | jupyter | python'
        required: true
        type: string
      runs_on:
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  python:
    name: ${{ inputs.wf_name }} (python)
    if: inputs.flavour == 'python'
    uses: ./.github/workflows/python-reusable.yaml
    with:
      wf_name: ${{ inputs.wf_name }}
      runs_on: ${{ inputs.runs_on }}

  flavour:
    name: ${{ inputs.wf_name }} (${{ inputs.flavour }})
    if: inputs.flavour != 'python'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 720
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up cwltool (cwl flavour only)
        if: inputs.flavour == 'cwl'
        uses: mamba-org/setup-micromamba@v2.0.0
        with:
          micromamba-version: '2.0.2-2'
          # required by the action whenever create-args is set
          environment-name: cwl
          create-args: >-
            cwltool

      - name: Run ${{ inputs.flavour }} e2e test for ${{ inputs.wf_name }}
        shell: bash -l {0}
        working-directory: ${{ inputs.wf_name }}/tests/${{ inputs.flavour }}
        run: ./run_test.sh

      # On failure, tar the test work dir (recorded by run_test.sh in
      # .e2e_workdir) and upload it: the sander/cwl/airflow logs behind a
      # failing step live there and are gone otherwise.
      - name: Tar e2e workdir on failure
        if: failure()
        shell: bash -l {0}
        run: |
          MARKER="${{ inputs.wf_name }}/tests/${{ inputs.flavour }}/.e2e_workdir"
          [[ -f "$MARKER" ]] || exit 0
          WD="$(cat "$MARKER")"
          [[ -d "$WD" ]] || exit 0
          # skip unreasonably large work dirs (keep the runner usable)
          [[ "$(du -sb "$WD" | cut -f1)" -lt 1073741824 ]] || exit 0
          tar -czf "$RUNNER_TEMP/e2e_workdir.tar.gz" \
            -C "$(dirname "$WD")" "$(basename "$WD")" || true

      - name: Upload e2e workdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-workdir-${{ inputs.wf_name }}-${{ inputs.flavour }}
          path: ${{ runner.temp }}/e2e_workdir.tar.gz
          if-no-files-found: ignore
