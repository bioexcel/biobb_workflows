name: Common Python

on:
  workflow_call:
    inputs:
      wf_name:
        required: true
        type: string
      runs_on:
        required: false
        type: string
        default: ubuntu-latest

jobs:
  python:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 720
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Reduce MPI cores and steps for ABC workflow
        if: contains(inputs.wf_name, 'biobb_wf_amber_abc_setup')
        run: |
          sed -i "s/mpi_np: [0-9]*/mpi_np: 2/g" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "s/nstlim: [0-9]*/nstlim: 100/g" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "s/maxcyc: [0-9]*/maxcyc: 50/g" ${{ inputs.wf_name }}/python/workflow.yml

      - name: Reduce MPI cores and steps for Amber workflows
        if: contains(inputs.wf_name, 'biobb_wf_amber_md_setup') || contains(inputs.wf_name, 'biobb_wf_amber_md_setup_lig')
        run: |
          sed -i "s/mpi_np: [0-9]*/mpi_np: 2/g" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "s/nstlim: [0-9]*/nstlim: 500/g" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "s/maxcyc: [0-9]*/maxcyc: 100/g" ${{ inputs.wf_name }}/python/workflow.yml

      - name: Reduce MDRun steps for PMX workflow
        if: contains(inputs.wf_name, 'pmx')
        run: |
          sed -i "s/nsteps: [0-9]*/nsteps: 50/g" ${{ inputs.wf_name }}/python/workflow.yml

      - name: Reduce MPI cores for Structure Checking workflow
        if: contains(inputs.wf_name, 'structure_checking')
        run: |
          sed -i "s/mpi_np: [0-9]*/mpi_np: 2/g" ${{ inputs.wf_name }}/python/workflow.yml

      - name: Reduce MDRun steps for GROMACS workflow
        if: contains(inputs.wf_name, 'biobb_wf_md_setup') || contains(inputs.wf_name, 'biobb_wf_md_setup_mutations') || contains(inputs.wf_name, 'biobb_wf_protein-complex_md_setup')
        run: |
          sed -i "s/nsteps: [0-9]*/nsteps: 10/g" ${{ inputs.wf_name }}/python/workflow.yml

      - run: echo "Repository -> ${{ github.repository }}"
      - run: echo "Branch -> ${{ github.ref }}"
      - run: echo "Trigger event -> ${{ github.event_name }}"
      - run: echo "Runner OS -> ${{ runner.os }}"

      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}

      - name: Remove all micromamba installations
        run: |
          rm -rf $HOME/.bash_profile $HOME/.conda $HOME/micromamba $HOME/micromamba-bin 2>/dev/null
          touch $HOME/.bash_profile

      - name: Install conda 26.7.1 (same conda as the docker images)
        run: |
          curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-py312_26.7.1-0-Linux-x86_64.sh -o /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -p "$HOME/miniconda3"

      - name: Create environment (same solver as the docker images)
        run: |
          "$HOME/miniconda3/bin/conda" config --set solver libmamba
          "$HOME/miniconda3/bin/conda" create -y -n biobb_env -f ${{ inputs.wf_name }}/python/workflow.env.yml pytest imagehash

      - name: List installed package versions
        run: '"$HOME/miniconda3/bin/conda" run -n biobb_env conda list'

      - name: Run tests
        run: |
          export PYTHONPATH=.:./biobb_common:$PYTHONPATH

          cd ${{ inputs.wf_name }}/tests/python

          # Production one
          "$HOME/miniconda3/bin/conda" run -n biobb_env pytest ${{ inputs.wf_name }}.py --config ../../python/workflow.yml --remove
