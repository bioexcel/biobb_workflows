name: Common Python

on:
  workflow_call:
    inputs:
      wf_name:
        required: true
        type: string
      runs_on:
        required: false
        type: string
        default: ubuntu-latest

jobs:
  python:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 720
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: GNU-style sed (macOS BSD sed needs a backup suffix for -i)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/bin"
          # translate GNU 'sed -i SCRIPT' calls to BSD 'sed -i "" SCRIPT';
          # pass every other sed call through untouched (e.g. the miniconda
          # installer runs plain 'sed SCRIPT' and would break otherwise)
          printf '#!/bin/sh\nif [ "$1" = "-i" ]; then shift; exec /usr/bin/sed -i "" "$@"; fi\nexec /usr/bin/sed "$@"\n' > "$HOME/bin/sed"
          chmod +x "$HOME/bin/sed"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Adjust runtime for ABC workflow (serial sander + reduced steps)
        if: contains(inputs.wf_name, 'biobb_wf_amber_abc_setup')
        run: |
          sed -i "s/mpi_np: [0-9]*/mpi_np: 2/g" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "s/nstlim: [0-9]*/nstlim: 100/g" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "s/maxcyc: [0-9]*/maxcyc: 50/g" ${{ inputs.wf_name }}/python/workflow.yml
          # biobb 5.3.x conda envs have no sander.MPI/mpirun (conda-forge
          # ships no openmpi ambertools build >= 25, and the 24.8 one does not
          # resolve alongside biobb_analysis 5.3.0's gromacs 2026 dep) — run
          # the sander steps serially in CI only; workflow.yml stays MPI.
          sed -i "/binary_path: sander.MPI/d" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "/^[[:space:]]*mpi_np: [0-9]*$/d" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "/^[[:space:]]*mpi_bin: mpirun$/d" ${{ inputs.wf_name }}/python/workflow.yml

      - name: Reduce MPI cores and steps for Amber workflows
        if: contains(inputs.wf_name, 'biobb_wf_amber_md_setup') || contains(inputs.wf_name, 'biobb_wf_amber_md_setup_lig')
        run: |
          sed -i "s/mpi_np: [0-9]*/mpi_np: 2/g" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "s/nstlim: [0-9]*/nstlim: 500/g" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "s/maxcyc: [0-9]*/maxcyc: 100/g" ${{ inputs.wf_name }}/python/workflow.yml
          # biobb 5.3.x conda envs have no sander.MPI/mpirun (conda-forge
          # ships no openmpi ambertools build >= 25, and the 24.8 one does not
          # resolve alongside biobb_analysis 5.3.0's gromacs 2026 dep) — run
          # the sander steps serially in CI only; workflow.yml stays MPI.
          sed -i "/binary_path: sander.MPI/d" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "/^[[:space:]]*mpi_np: [0-9]*$/d" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "/^[[:space:]]*mpi_bin: mpirun$/d" ${{ inputs.wf_name }}/python/workflow.yml

      - name: Reduce MDRun steps for PMX workflow
        if: contains(inputs.wf_name, 'pmx')
        run: |
          sed -i "s/nsteps: [0-9]*/nsteps: 50/g" ${{ inputs.wf_name }}/python/workflow.yml

      - name: Run sander serially for Structure Checking workflow
        if: contains(inputs.wf_name, 'structure_checking')
        run: |
          # biobb 5.3.x conda envs resolve the unpinned ambertools dep to the
          # latest build, which conda-forge ships nompi (no sander.MPI/mpirun
          # — the MPI builds stopped at 24.8). Run the (already short,
          # 500-cycle) sander minimization serially in CI only; workflow.yml
          # stays MPI.
          sed -i "/binary_path: sander.MPI/d" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "/^[[:space:]]*mpi_np: [0-9]*$/d" ${{ inputs.wf_name }}/python/workflow.yml
          sed -i "/^[[:space:]]*mpi_bin: mpirun$/d" ${{ inputs.wf_name }}/python/workflow.yml

      - name: Reduce MDRun steps for GROMACS workflow
        if: contains(inputs.wf_name, 'biobb_wf_md_setup') || contains(inputs.wf_name, 'biobb_wf_md_setup_mutations')
        run: |
          sed -i "s/nsteps: [0-9]*/nsteps: 10/g" ${{ inputs.wf_name }}/python/workflow.yml

      - name: Reduce free-MD steps for protein-complex workflow
        if: inputs.wf_name == 'biobb_wf_protein-complex_md_setup'
        run: |
          # Only the free MD is reduced: with nsteps 10 the NPT runs on an
          # un-equilibrated system, the pressure coupling blows it up and
          # gmx mdrun segfaults (exit -11) before writing its .gro. min/
          # NVT/NPT keep the workflow's own values (5000/50000/50000).
          sed -i "s/nsteps: 250000/nsteps: 10/" ${{ inputs.wf_name }}/python/workflow.yml

      - run: echo "Repository -> ${{ github.repository }}"
      - run: echo "Branch -> ${{ github.ref }}"
      - run: echo "Trigger event -> ${{ github.event_name }}"
      - run: echo "Runner OS -> ${{ runner.os }}"

      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}

      - name: Remove all micromamba installations
        run: |
          rm -rf $HOME/.bash_profile $HOME/.conda $HOME/micromamba $HOME/micromamba-bin 2>/dev/null
          touch $HOME/.bash_profile

      - name: Check Rosetta 2 (macOS x86_64 conda needs it on ARM runners)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          if ! arch -x86_64 /bin/echo "Rosetta 2 available"; then
            echo "::error::Rosetta 2 not found; the x86_64 Miniconda cannot run on this runner"
            exit 1
          fi

      # macOS ARM runners get the native arm64 conda (same 26.7.1 as the
      # docker images) first. Some envs do not resolve for osx-arm64 (e.g.
      # biobb_amber has no osx-arm64 build); the Create environment step then
      # falls back to the last x86_64 Miniconda build (25.7.0 — Anaconda
      # stopped macOS-Intel builds after it), which runs under Rosetta 2 and
      # resolves for osx-64.
      - name: Install conda (26.7.1 like the docker images; native arm64 on macOS ARM)
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    conda_build=Miniconda3-py312_26.7.1-0-Linux-x86_64 ;;
            Linux-ARM64)  conda_build=Miniconda3-py312_26.7.1-0-Linux-aarch64 ;;
            macOS-ARM64)  conda_build=Miniconda3-py312_26.7.1-0-MacOSX-arm64 ;;
            macOS-X64)    conda_build=Miniconda3-py312_25.7.0-2-MacOSX-x86_64 ;;
            *) echo "Unsupported runner: ${{ runner.os }}/${{ runner.arch }}"; exit 1 ;;
          esac
          curl -fsSL "https://repo.anaconda.com/miniconda/${conda_build}.sh" -o /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -p "$HOME/miniconda3"

      - name: Create environment (same solver as the docker images)
        if: runner.os == 'Linux'
        run: |
          "$HOME/miniconda3/bin/conda" config --set solver libmamba
          "$HOME/miniconda3/bin/conda" create -y -n biobb_env -f ${{ inputs.wf_name }}/python/workflow.env.yml pytest imagehash

      - name: Create environment (macOS, native arm64 with x86_64/Rosetta fallback)
        if: runner.os == 'macOS'
        run: |
          "$HOME/miniconda3/bin/conda" config --set solver libmamba
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            # same create command as the ubuntu lane
            if "$HOME/miniconda3/bin/conda" create -y -n biobb_env -f ${{ inputs.wf_name }}/python/workflow.env.yml pytest imagehash; then
              echo "Environment resolved for osx-arm64"
              exit 0
            fi
            echo "::warning::Environment does not resolve for osx-arm64; retrying with x86_64 (Rosetta, osx-64)"
            rm -rf "$HOME/miniconda3"
            curl -fsSL "https://repo.anaconda.com/miniconda/Miniconda3-py312_25.7.0-2-MacOSX-x86_64.sh" -o /tmp/miniconda.sh
            bash /tmp/miniconda.sh -b -p "$HOME/miniconda3"
            "$HOME/miniconda3/bin/conda" config --set solver libmamba
          fi
          # conda 25.7.0 (last x86_64 macOS build) 'create' does not read
          # env-format files: pull the deps out of the env file into a plain
          # spec list (one spec per line, so 'mkl <2026' stays one spec) and
          # add the test deps.
          grep -E '^[[:space:]]*-[[:space:]]+' "${{ inputs.wf_name }}/python/workflow.env.yml" \
            | sed -E 's/^[[:space:]]*-[[:space:]]+//' \
            | grep -vE '^(conda-forge|bioconda|nodefaults)$' \
            | grep -vE '^[a-z_]+:' > /tmp/wf_specs.txt
          echo pytest >> /tmp/wf_specs.txt
          echo imagehash >> /tmp/wf_specs.txt
          "$HOME/miniconda3/bin/conda" create -y -n biobb_env --file /tmp/wf_specs.txt -c conda-forge -c bioconda

      - name: List installed package versions
        run: '"$HOME/miniconda3/bin/conda" run -n biobb_env conda list'

      - name: Run tests
        run: |
          export PYTHONPATH=.:./biobb_common:$PYTHONPATH

          cd ${{ inputs.wf_name }}/tests/python

          # Production one
          "$HOME/miniconda3/bin/conda" run -n biobb_env pytest ${{ inputs.wf_name }}.py --config ../../python/workflow.yml --remove
