on:
  push:
    paths:
      - common/docker/Dockerfile
      - common/docker/sync_dockerfiles.sh
      - .github/workflows/docker.yaml
  workflow_dispatch:

name: Dockerfile

jobs:
  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-murray/workflow-application-token-action@v3
        id: generate_token
        with:
          application_id: ${{ vars.GHAPUSH }}
          application_private_key: ${{ secrets.GHAPUSH }}
      - uses: actions/checkout@v3
        with:
          token: ${{ steps.generate_token.outputs.token }}
      - name: Regenerate per-workflow Dockerfiles from the template
        run: bash common/docker/sync_dockerfiles.sh
      - name: Commit and push changes (only if any)
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add */docker/Dockerfile
          if git diff --cached --quiet; then
            echo "No Dockerfile changes to commit"
          else
            git commit -m "Updated Dockerfile" && git push
          fi
