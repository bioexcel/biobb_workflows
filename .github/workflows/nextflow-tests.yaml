name: Nextflow e2e Tests (auto)

# Test-what-you-changed for the nextflow flavour: a push touching a workflow's
# nextflow/ (main.nf, nextflow.config, modules, inputs) or its tests/nextflow/
# runs that wf's nextflow e2e (tests/nextflow/run_test.sh via
# flavour-test-reusable.yaml). Both are generated by utils_biobb
# nextflow_wf_generator.py. Test-only — nothing is published from nextflow.
# A wf opts out with tests/nextflow/SKIP (reason printed; see ci.md §1.2).

on:
  push:
    paths:
      - 'biobb_wf_*/nextflow/**'
      - 'biobb_wf_*/tests/nextflow/**'

# if you push twice quickly, cancel the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect workflows to test (nextflow)
    uses: ./.github/workflows/detect.yaml
    if: github.actor != 'github-actions[bot]'
    with:
      flavour: nextflow

  test:
    name: ${{ matrix.wf }} (nextflow)
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.matrix != '[]'
    uses: ./.github/workflows/flavour-test-reusable.yaml
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    with:
      wf_name: ${{ matrix.wf }}
      flavour: nextflow
